services:
  - type: web
    name: task1-job-ingestion-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: REVIEWER_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SQLITE_PATH
        value: /var/data/jobs.sqlite3
